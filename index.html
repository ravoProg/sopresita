<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="caja-de-regalo.png">
    <style>
        body, html { margin: 0; padding: 0; background-color: black; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000 };
        
        const phrase = " TE AMO I LOVE YOU JE T'AIME TI AMO ICH LIEBE DICH WO AI NI SUKI DESU ";
        const fontSize = 14;
        
        function init() {
            width = canvas.width = window.innerWidth || 800;
            height = canvas.height = window.innerHeight || 600;
            
            const hiddenCanvas = document.createElement('canvas');
            const hCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
            hiddenCanvas.width = width;
            hiddenCanvas.height = height;
            
            let textFontSize = Math.max(width * 0.25, 150);
            hCtx.font = `900 ${textFontSize}px monospace`;
            hCtx.fillStyle = 'white';
            hCtx.textAlign = 'center';
            hCtx.textBaseline = 'middle';
            hCtx.fillText("LU❤", width / 2, height / 2);
            
            const imageData = hCtx.getImageData(0, 0, width, height).data;
            particles = [];
            
            let charIndex = 0;
            for (let y = 0; y < height; y += fontSize) {
                for (let x = 0; x < width; x += fontSize * 0.6) {
                    const index = (Math.floor(y) * width + Math.floor(x)) * 4;
                    const alpha = imageData[index + 3];
                    
                    if (alpha > 128) {
                        particles.push({
                            x: x,
                            y: y,
                            char: phrase[charIndex % phrase.length],
                            opacity: 0,
                            revealed: false
                        });
                        charIndex++;
                    }
                }
            }
        }
        
        function animate() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);
            
            ctx.font = `bold ${fontSize}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 120) {
                    p.revealed = true;
                }
                
                if (p.revealed && p.opacity < 1) {
                    p.opacity += 0.05;
                }
                
                if (p.opacity > 0) {
                if (p.x > width * 0.50) { 
                    ctx.fillStyle = `rgba(255, 0, 35, ${p.opacity})`; // Rojo intenso (RGB: 255, 0, 35)
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`; // Blanco para el resto
                }
                ctx.fillText(p.char, p.x, p.y);
            }
            }
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(init, 200);
        });
        
        init();
        animate();
    </script>
</body>
</html>
